const FM = window.Motion || window.FramerMotion || {};
const { motion, AnimatePresence, useScroll, useTransform, useInView, useMotionValue, animate, useSpring } = FM;
const { useState, useEffect, useRef } = React;
const ease = [0.22, 1, 0.36, 1];

const fadeUp = {
  hidden: { opacity: 0, y: 28 },
  show: (i = 0) => ({ opacity: 1, y: 0, transition: { duration: 0.7, ease, delay: i * 0.08 } })
};

function Reveal({ children, delay = 0, y = 28, className, style }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-80px" });
  return (
    <motion.div ref={ref} className={className} style={style}
      initial={{ opacity: 0, y }}
      animate={inView ? { opacity: 1, y: 0 } : {}}
      transition={{ duration: 0.7, ease, delay }}>
      {children}
    </motion.div>
  );
}

function Counter({ to, suffix = "", prefix = "", duration = 1.8 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-60px" });
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!inView) return;
    const controls = animate(0, to, {
      duration, ease,
      onUpdate: (v) => setVal(Math.round(v))
    });
    return () => controls.stop();
  }, [inView, to]);
  return <span ref={ref}>{prefix}{val.toLocaleString("es-AR")}{suffix}</span>;
}
